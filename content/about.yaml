# Biography and CV. Years are plain text so ranges like "2024-2026" work.

short_bio: >-
  Roberto Cerbino is Professor of Experimental Soft Matter Physics at the
  University of Vienna, where he leads the SoMeX laboratory. He co-invented
  Differential Dynamic Microscopy and works on the dynamics of soft and living
  matter, from colloids and gels to migrating cells, including experiments in
  microgravity. He is an Associate Editor of Soft Matter, a Fellow of the Royal
  Society of Chemistry and Vice-Dean of the Faculty of Physics.

bio:
  - >-
    Roberto Cerbino (born 1975, Italy) is Professor of Experimental Soft Matter
    Physics at the University of Vienna, where he leads the [SoMeX (Soft Matter
    Experiments) laboratory](https://somexlab.github.io/). He studied physics at the University of Milan,
    where he obtained his Laurea in 2001 and his PhD in 2004, with work on
    convective instabilities and non-equilibrium fluctuations in complex fluids.
    After two years as a postdoctoral researcher in Milan, he held a [Marie
    Sklodowska-Curie](https://marie-sklodowska-curie-actions.ec.europa.eu/) Intra-European Fellowship at the [University of Fribourg](https://www.unifr.ch/phys/en/research/groups/scheffold/)
    (2006-2007), developing new optical approaches to non-equilibrium soft matter.
  - >-
    He returned to the University of Milan in 2007 as Ricercatore Universitario,
    a permanent faculty position, in the field of applied and medical physics,
    became Associate Professor in 2015, and moved to Vienna in 2021. Along the way he spent research periods at the University of
    Ottawa (2010), ENS Lyon (2018) and ESPCI Paris (2025).
  - >-
    His research combines new optical instruments with quantitative analysis to
    understand soft and biological materials. He is best known for [Differential
    Dynamic Microscopy](site:research/#ddm) (DDM), [introduced with Veronique Trappe in 2008](https://doi.org/10.1103/PhysRevLett.100.188102), which
    extracts scattering-type information about motion at many length scales from
    ordinary microscope movies and is now used in laboratories worldwide. His
    work spans [colloids, gels and foams under deformation](site:research/#rheo), [active and living
    matter](site:research/#living) such as migrating epithelial and cancer cells, and non-equilibrium
    fluctuations studied [on the ground and in space](site:research/#space).
  - >-
    He is an Associate Editor of [Soft Matter](https://pubs.rsc.org/en/journals/journalissues/sm), Series Editor of the Springer
    book series [Soft and Biological Matter](https://link.springer.com/series/10783), and a Fellow of the Royal Society of
    Chemistry. He chairs the Board of the [Liquid Matter Division of the European
    Physical Society](https://www.eps.org/eps-cmd) and serves on
    the European Space Agency's [Human Spaceflight and Exploration Science Advisory Committee](https://explorationscience.esa.int/science-advisory/test-science-advisory-groups/) and
    on the [European Space Sciences Committee](https://www.essc.esf.org/). At the University of Vienna he is
    Vice-Dean of the [Faculty of Physics](https://physik.univie.ac.at/), for Teaching and International Affairs.

