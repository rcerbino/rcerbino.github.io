# Biography and CV. Years are plain text so ranges like "2024-2026" work.

short_bio: >-
  Roberto Cerbino is Professor of Experimental Soft Matter Physics at the
  University of Vienna, where he leads the SoMeX laboratory. He co-invented
  Differential Dynamic Microscopy and works on the dynamics of soft and living
  matter, from colloids and gels to migrating cells, including experiments in
  microgravity. He is an Associate Editor of Soft Matter, a Fellow of the Royal
  Society of Chemistry and Vice-Dean of the Faculty of Physics.

bio:
  - >-
    Roberto Cerbino (born 1975, Italy) is Professor of Experimental Soft Matter
    Physics at the University of Vienna, where he leads the SoMeX (Soft Matter
    Experiments) laboratory. He studied physics at the University of Milan and
    obtained his PhD there in 2004, with work on convective instabilities and
    non-equilibrium fluctuations in complex fluids. He then held a Marie
    Sklodowska-Curie Intra-European Fellowship at the University of Fribourg
    (2006-2007), developing new optical approaches to non-equilibrium soft matter.
  - >-
    He returned to the University of Milan in 2007 as a faculty member in the
    Faculty of Medicine, working in applied and medical physics, and moved to
    Vienna in 2021. Along the way he spent research periods at the University of
    Ottawa (2010), ENS Lyon (2018) and ESPCI Paris (2025).
  - >-
    His research combines new optical instruments with quantitative analysis to
    understand soft and biological materials. He is best known for Differential
    Dynamic Microscopy (DDM), introduced with Veronique Trappe in 2008, which
    extracts scattering-type information about motion at many length scales from
    ordinary microscope movies and is now used in laboratories worldwide. His
    work spans colloids, gels and foams under deformation, active and living
    matter such as migrating epithelial and cancer cells, and non-equilibrium
    fluctuations studied on the ground and in space.
  - >-
    He is an Associate Editor of Soft Matter, Series Editor of the Springer
    series on Soft Matter and Biophysics, and a Fellow of the Royal Society of
    Chemistry. He chairs the Board of the Liquid Matter Division of the European
    Physical Society and serves on
    the European Space Agency's Human Exploration Science Advisory Committee and
    on the European Space Sciences Committee. At the University of Vienna he is
    Vice-Dean of the Faculty of Physics, for Teaching and International Affairs.

