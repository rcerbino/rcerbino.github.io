# Images and visuals for the inner pages.
#
# Every inner page opens with a round "view down the microscope". It shows
# either a photo from the SoMeX lab (src) or a live, simulated speckle
# pattern (speckle: true). Captions are short and say what the image is.
#
# Lab photos come from the SoMeX website (somexlab.github.io, CC BY-NC-ND 4.0);
# keep them in static/img/lab/. Figures from open-access papers live in
# static/img/papers/ and must carry a credit (authors, journal, year, licence)
# and a link to the paper; use only figures whose licence allows reuse.
# native: true shows a figure whole, at its own shape, on a white card.

heads:
  About:
    speckle: true
    caption: A simulated speckle pattern, the kind of signal Differential Dynamic Microscopy reads.
  Research:
    src: img/lab/cells.jpg
    caption: Cells in a monolayer. Image from the SoMeX lab.
  Publications:
    src: img/lab/gel-particles.jpg
    caption: From our work on training and memory in soft materials.
  Teaching:
    src: img/lab/lab-bench.jpg
    position: 62% 40%
    caption: In the SoMeX lab.
  Approach:
    src: img/lab/fluctuation-forces.jpg
    caption: From our work on forces created by fluctuations.
  News:
    src: img/lab/bioprinting.jpg
    caption: From our work on rheology for 3D bioprinting.
  Contact:
    src: img/lab/entrance.jpg
    position: 50% 35%
    caption: The main entrance of the Faculty of Physics, Strudlhofgasse 4, where the directions to the lab start.

# Figures next to the research themes (research.yaml theme ids).
themes:
  ddm:
    src: img/papers/ddm-steps.jpg
    native: true
    caption: "How DDM works: subtract two images taken a time apart (a-c), compute the power spectrum of the difference (d), see how it grows with the time delay at each wave vector (e) and read off the relaxation rate (f)."
    credit: P. Edera et al., Soft Matter (2021), CC BY 4.0
    credit_url: https://doi.org/10.1039/d1sm01068a
  rheo:
    src: img/papers/shearview.jpg
    native: true
    caption: ShearView, our compact rheometer that sits on top of an optical microscope.
    credit: N. Kalafatakis and R. Cerbino, Journal of Rheology (2026), arXiv version, CC BY 4.0
    credit_url: https://arxiv.org/abs/2508.08951
  living:
    src: img/lab/monolayer.jpg
    caption: From our work on the structure and motion of cell monolayers.
  space:
    src: img/papers/fractal-fronts.jpg
    native: true
    caption: Concentration fluctuations during diffusion, in space (top, aboard the FOTON-M3 satellite) and on Earth (bottom). Without gravity they grow much larger.
    credit: A. Vailati et al., Nature Communications (2011), CC BY-NC-SA 3.0
    credit_url: https://doi.org/10.1038/ncomms1290
  scattering:
    speckle: true
    caption: A live simulated speckle pattern. Small grains change fast, large ones slowly, as for particles in Brownian motion.

lab:
  src: img/lab/setup.jpg
  caption: One of our microscope set-ups.

group:
  src: img/lab/group-2026.jpg
  caption: The SoMeX group in 2026.

# Career map on the About page. Places are drawn as coloured stretches of one
# line; milestones sit above it (row 0 or 1, to keep labels apart), research
# stays below it. "to: now" runs to the current year.
career:
  start: 2000
  places:
    - {name: Milan, from: 2000, to: 2006, colour: milan}
    - {name: Fribourg, from: 2006, to: 2007, colour: fribourg}
    - {name: Milan, from: 2007, to: 2021, colour: milan}
    - {name: Vienna, from: 2021, to: now, colour: vienna}
  labels:
    - {name: Milan, at: 2011, colour: milan}
    - {name: Fribourg, at: 2006.5, colour: fribourg}
    - {name: Vienna, at: 2024, colour: vienna}
  milestones:
    - {year: 2001, label: Laurea, row: 0}
    - {year: 2004, label: PhD, row: 1, side: left}
    - {year: 2006, label: Marie Curie fellow, row: 0}
    - {year: 2007, label: Ricercatore, row: 1}
    - {year: 2015, label: Associate Professor, row: 0}
    - {year: 2021, label: Professor, row: 1}
  stays:
    - {year: 2010, label: Ottawa}
    - {year: 2018, label: Lyon}
    - {year: 2025, label: Paris}

