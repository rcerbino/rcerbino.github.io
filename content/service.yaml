# Service: committees, panels, boards, juries, and evaluations other than
# journal refereeing. Shown on the Service page.
#
# Rules (agreed with Roberto, Nov 2026):
#   - Boards, committees, juries and institutional evaluations: named in full.
#   - Doctoral theses and habilitations: candidate, university, role, year.
#     Add a thesis only once the report is sent or the defence has taken place.
#   - Promotion and appointment cases: institution, country and year only.
#     Never the name of the person evaluated.
#   - Grant and fellowship reviewing: ONE summary line (grants_line), no list,
#     never a proposal. It stays out of the bio, roles and news.
#   - Not listed: journal refereeing, reference letters, own students,
#     invitations that were declined or did not go ahead.
#
# standing: roles held over several years, newest first inside each group.
# activities: single evaluations, newest first. Each has
#   date:  YYYY; leave it out when the year is not known and give `when:` instead
#          (for example "before 2020"); such entries are listed last and are not in the chart
#   group: thesis (doctoral theses and habilitations)
#          people (promotions, appointments, hiring and selection boards)
#          jury   (prize juries, selection panels, conference committees)
#          institution (evaluation of institutions)
#   kind:  the list it appears in: phd, habilitation, career, hiring, jury,
#          conference, institution
#   what, where: plain text; role: optional.

intro: >-
  Much of the work of a scientist happens on committees, boards and juries, and in reading and
  judging the work of others. This page lists what I have done.

# Shown under the opening lines.
partial_note: >-
  The lists are partial. Over the years I did not keep an accurate record of these activities,
  so earlier ones in particular are missing.

grants_line: >-
  I also review grant and fellowship applications for the European Research Council, the European
  Space Agency and national funding bodies in nine countries. I do not list them one by one.

