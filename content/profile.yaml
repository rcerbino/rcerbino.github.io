# One paragraph shown on the home page
intro: >-
  I am a physicist. With my group at the University of Vienna I use light and
  microscopy to measure how soft and living materials move, flow, age and break:
  colloids, gels, foams, and sheets of migrating cells. I co-invented Differential
  Dynamic Microscopy, a method that turns an ordinary microscope into a
  light-scattering instrument, and I take part in European experiments run in
  microgravity.

