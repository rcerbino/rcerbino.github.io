intro: >-
  Alongside research, I have worked for many years on how universities teach:
  first as the Rector's Delegate for
  the development of innovative teaching methodologies at the University of
  Milan (2017-2018), now as
  Vice-Dean for Teaching of the Faculty of Physics in Vienna.

courses:
  - title: Scientific Image Processing
    where: University of Vienna
    text: >-
      A course I created on getting quantitative, reproducible results out of
      scientific images. Co-taught with Maxime Lavaud.
  - title: Principles of Soft Matter Physics
    level: Master's and doctoral, physics
    where: University of Vienna
    text: >-
      The physical principles behind colloids, polymers and other soft
      materials: thermal fluctuations, hydrodynamics and elasticity, with
      theory and experiments side by side. Co-taught with Christos Likos.
  - title: Theoretical Physics IV - Thermodynamics
    level: Bachelor, physics teacher education
    where: University of Vienna
    text: >-
      Thermodynamics for future secondary-school
      physics teachers, with my own lecture notes.
  - title: Academic Skills and Ethics
    level: Master's, physics
    where: University of Vienna
    text: >-
      Scientific writing and publishing, presenting, and research ethics and
      integrity.
  - title: Kicking off your PhD / Mastering your PhD
    level: Doctoral
    where: Vienna Doctoral School in Physics
    text: >-
      Two courses I designed for doctoral candidates, at the start and in the
      later phase of their PhD.

innovation:
  - >-
    At the University of Milan, as Rector's Delegate for the development of
    innovative teaching methodologies (2017-2018), I set up the university's
    Faculty Development programme for teaching staff. In the 4EU+ European
    university alliance I co-led Flagship 1 (2019-2020) and then led the work
    package on innovative education (2020-2021).
  - >-
    In Vienna I develop soft-skills courses for master's and doctoral students and
    work with colleagues on AI-based approaches to teaching and learning in
    physics, including an AI tutor piloted in physics lectures.
  - >-
    I am a co-author of Italian textbooks of physics for medicine and biomedical
    sciences.

