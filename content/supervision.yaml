# Supervision page (/supervision/). Template: templates/supervision.html.
#
# Rules (set by Roberto):
# - The figures at the top of the page are counted from these lists by the
#   template. Never write a number by hand.
# - "The group now" is not here: it is read from data/people.json (SoMeX people
#   page, refreshed by scripts/sync_people.py).
# - No notes on the page about where information came from, when it was
#   collected or how it is kept up to date.
# - An entry is: name, then "meta" (place, years, shared supervision), then the
#   thesis title, linked when "url" is given. "co-supervised with X" is used when
#   the official supervisor was X or the supervision was shared with X.
# - The page for Stefano Mazzoni (templates/mazzoni.html) is never changed by
#   any automatic update.

intro:
  - "The whole group meets once a week, and I see each member one-to-one every two weeks. I am always there when someone needs me, but I do not micromanage unless I really have to. I know this freedom can be confusing, especially at the start of a project. However, every project in my lab is a new avenue of exploration, and the people working on it are the ones driving the car. I see myself more as a co-pilot and a facilitator."
  - "The people I have supervised, in Milan until 2021 and in Vienna since. Where nothing else is said I was the main supervisor; otherwise the entry names the colleague I shared the supervision with."

